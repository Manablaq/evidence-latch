name: Contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  direct-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install GenLayer test runner
        run: python -m pip install -r requirements-dev.txt
      - name: Run direct-mode tests
        env:
          GENVM_VERSION: v0.3.0-rc4
        run: python -m pytest tests/ -q
      - name: Validate contract and types
        env:
          GENVM_VERSION: v0.3.0-rc4
        run: |
          genvm-lint check contracts/evidence_latch.py
          genvm-lint typecheck contracts/evidence_latch.py
